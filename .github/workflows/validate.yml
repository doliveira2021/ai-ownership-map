name: Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate ASRA configuration
        run: bun scripts/validate-asra.ts

      - name: Validate localization coverage
        run: bun scripts/validate-i18n.ts

      - name: Validate Action Packs and tracker export
        run: bun scripts/validate-action-packs.ts

      - name: Test ASRA scoring scenarios
        run: bun scripts/test-asra-scoring.ts

      - name: Run ASRA pilot profiles
        run: bun scripts/pilot-asra-scenarios.ts

      - name: Build
        run: bun run build

      - name: Lint code quality
        run: bunx eslint . --quiet --rule "prettier/prettier: off"
