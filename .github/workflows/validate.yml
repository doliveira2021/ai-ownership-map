name: Validate

on:
  pull_request:
  push:
    branches:
      - main
      - feature/assessment-methodology-foundation

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate ASRA configuration
        run: bun scripts/validate-asra.ts

      - name: Test ASRA scoring scenarios
        run: bun scripts/test-asra-scoring.ts

      - name: Build
        run: bun run build

      - name: Lint
        run: bun run lint
